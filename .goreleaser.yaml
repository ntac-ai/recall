version: 2
project_name: recall

builds:
  - main: .
    binary: recall
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
